<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StudentHub | Student Login</title>
        <link rel="stylesheet" href="login.css">
    </head>

    <body>
        <main class="login-card">
            <h1>StudentHub</h1>
            <p class="subtitle">Your student life, simplified.</p>

            <form id="loginForm">
                <label for="email">Student Email</label>
                <input type="email" id="email" required placeholder="Enter your registered email">

                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">

                <button type="submit" id="loginButton">Log In</button>
                <p id="message" role="status"></p>
            </form>

            <p class="register-link">
                New student? <a href="register.html">Create an account</a>
            </p>
        </main>

        <script src="login.js"></script>
    </body>

</html>
